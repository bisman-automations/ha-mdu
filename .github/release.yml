changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 💥 Breaking Changes
      labels: [breaking]
    - title: ✨ New Features
      labels: [feature]
    - title: 🐛 Bug Fixes
      labels: [bug]
    - title: ⚡ Performance
      labels: [performance]
    - title: 📝 Documentation
      labels: [documentation]
    - title: 🧰 Maintenance
      labels: [maintenance, dependencies]
    - title: Other Changes
      labels: ["*"]
